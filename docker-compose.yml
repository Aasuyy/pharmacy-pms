version: '3.8'

services:
  # ─── Pharmacy API ───
  api:
    build: .
    container_name: pharmacy-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///data/pharmacy.db
    restart: unless-stopped
    networks:
      - pharmacy-net

  # ─── Redis Cache (optional) ───
  # redis:
  #   image: redis:7-alpine
  #   container_name: pharmacy-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - pharmacy-net

  # ─── PostgreSQL (optional, for production) ───
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: pharmacy-db
  #   environment:
  #     POSTGRES_DB: pharmacy
  #     POSTGRES_USER: pharmacy
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - pharmacy-net

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: pharmacy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - pharmacy-net

networks:
  pharmacy-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
